<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imama's Beauty Salon & Training Centre — Mandi Bahauddin</title>
    
    <!-- Google Fonts & Font Awesome CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- GLOBAL LUXURY ARCHITECTURE & CSS VARIABLES --- */
        :root {
            --primary-plum: #4A1942;
            --rose-gold: #C9956C;
            --blush-pink: #F2C4CE;
            --champagne: #F7E7CE;
            --ivory-white: #FDF6F0;
            --charcoal: #1A1A2E;
            
            /* Theme Tokens (Light Mode Default) */
            --bg-main: var(--ivory-white);
            --bg-surface: #FFFFFF;
            --bg-surface-alt: var(--blush-pink);
            --text-main: var(--charcoal);
            --text-muted: #555566;
            --text-light: #FFFFFF;
            --border-color: rgba(74, 25, 66, 0.1);
            --glass-bg: rgba(253, 246, 240, 0.85);
            --glass-border: rgba(199, 149, 108, 0.2);
            --shadow: 0 10px 30px rgba(74, 25, 66, 0.05);
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --bg-main: #120610;
            --bg-surface: var(--charcoal);
            --bg-surface-alt: #251322;
            --text-main: var(--ivory-white);
            --text-muted: #C0A9BC;
            --border-color: rgba(201, 149, 108, 0.2);
            --glass-bg: rgba(26, 26, 46, 0.85);
            --glass-border: rgba(201, 149, 108, 0.3);
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s var(--transition), color 0.5s var(--transition);
        }

        h1, h2, h3, h4, .logo-main {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
        }

        section {
            padding: 6rem 5% 5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 3rem;
            color: var(--primary-plum);
            margin-bottom: 1rem;
        }

        [data-theme="dark"] .section-header h2 {
            color: var(--rose-gold);
        }

        .section-header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- UTILITY COMPONENTS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-plum), #6B2D62);
            color: var(--text-light);
            box-shadow: 0 5px 15px rgba(74, 25, 66, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(74, 25, 66, 0.4);
            background: linear-gradient(135deg, #6B2D62, var(--primary-plum));
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary-plum);
            border: 2px solid var(--primary-plum);
        }

        [data-theme="dark"] .btn-secondary {
            color: var(--rose-gold);
            border-color: var(--rose-gold);
        }

        .btn-secondary:hover {
            background: var(--primary-plum);
            color: var(--text-light);
            transform: translateY(-3px);
        }

        [data-theme="dark"] .btn-secondary:hover {
            background: var(--rose-gold);
            color: var(--charcoal);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
        }

        /* --- SCROLL REVEAL ENGINE --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- NAVBAR --- */
        .navbar-sentinel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
            background: transparent;
        }

        .navbar-sentinel.scrolled {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.7rem 5%;
            box-shadow: var(--shadow);
        }

        .logo-block {
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .logo-main {
            font-size: 1.8rem;
            color: var(--primary-plum);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        [data-theme="dark"] .logo-main { color: var(--rose-gold); }

        .logo-sub {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-menu {
            display: flex;
            gap: 1.8rem;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
            padding: 0.3rem 0;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--rose-gold);
            transition: var(--transition);
        }

        .nav-menu a:hover::after, .nav-menu a.active::after {
            width: 100%;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--rose-gold);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            transition: var(--transition);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-button:hover {
            background-color: rgba(199, 149, 108, 0.15);
            color: var(--rose-gold);
        }

        .hamburger-icon {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            width: 28px;
        }

        .hamburger-icon span {
            width: 100%;
            height: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: var(--transition);
        }

        .hamburger-icon.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger-icon.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-icon.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* --- HERO SECTION --- */
        .canvas-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fcecef 0%, #fae5db 50%, #eae2f8 100%);
            position: relative;
            overflow: hidden;
            text-align: center;
            padding-top: 100px;
        }

        [data-theme="dark"] .canvas-hero {
            background: linear-gradient(135deg, #2a0e25 0%, #171126 100%);
        }

        /* CSS Canvas Particles & Sparkles */
        .sparkle-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(201,149,108,0) 70%);
            border-radius: 50%;
            animation: floatParticle 8s infinite ease-in-out;
            opacity: 0.6;
        }

        .particle:nth-child(1) { width: 12px; height: 12px; top: 20%; left: 15%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 8px; height: 8px; top: 60%; left: 80%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 15px; height: 15px; top: 75%; left: 25%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 10px; height: 10px; top: 30%; left: 70%; animation-delay: 1s; }
        
        .floating-beauty-icon {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            animation: floatParticle 6s infinite ease-in-out;
            z-index: 1;
        }
        
        .f-icon-1 { top: 25%; left: 8%; animation-delay: 0.5s; }
        .f-icon-2 { top: 70%; left: 12%; animation-delay: 3s; }
        .f-icon-3 { top: 40%; right: 10%; animation-delay: 1.5s; }
        .f-icon-4 { top: 75%; right: 18%; animation-delay: 4.5s; }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-25px) scale(1.1) rotate(15deg); }
        }

        .hero-inner-container {
            max-width: 900px;
            position: relative;
            z-index: 5;
        }

        .hero-badge {
            background: rgba(74, 25, 66, 0.06);
            border: 1px solid rgba(74, 25, 66, 0.15);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary-plum);
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease;
        }

        [data-theme="dark"] .hero-badge {
            background: rgba(201, 149, 108, 0.12);
            border-color: rgba(201, 149, 108, 0.3);
            color: var(--rose-gold);
        }

        .hero-inner-container h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            color: var(--primary-plum);
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s ease 0.2s both;
        }

        [data-theme="dark"] .hero-inner-container h1 { color: var(--ivory-white); }
        .hero-inner-container h1 span { color: var(--rose-gold); }

        .hero-inner-container p {
            font-size: 1.4rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeInUp 1s ease 0.4s both;
        }

        .hero-ctas {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            animation: fadeInUp 1s ease 0.6s both;
        }

        .down-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: var(--primary-plum);
            animation: pulseArrow 2s infinite;
            z-index: 5;
            cursor: pointer;
        }

        [data-theme="dark"] .down-indicator { color: var(--rose-gold); }

        @keyframes pulseArrow {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.5; }
            50% { transform: translate(-50%, 15px); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ABOUT SECTION --- */
        .about-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2.5rem;
            color: var(--primary-plum);
            margin-bottom: 1.5rem;
        }

        [data-theme="dark"] .about-text h3 { color: var(--rose-gold); }

        .about-text p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .metrics-engine {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background-color: var(--bg-surface);
            padding: 1.8rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: var(--transition);
        }

        .metric-card:hover {
            transform: translateY(-5px);
            border-color: var(--rose-gold);
        }

        .counter-numeric {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary-plum);
            font-family: 'Cormorant Garamond', serif;
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        [data-theme="dark"] .counter-numeric { color: var(--rose-gold); }
        .counter-label { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .social-proof-strip {
            background: var(--bg-surface-alt);
            border-radius: 16px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }

        .social-proof-strip h4 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .social-networks-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .social-hub-card {
            background: var(--bg-surface);
            padding: 1.2rem 0.5rem;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .social-hub-card i { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .fa-facebook { color: #1877F2; }
        .fa-instagram { color: #E1306C; }
        .fa-tiktok { color: #000000; }
        [data-theme="dark"] .fa-tiktok { color: #FFFFFF; }

        .social-hub-card span { display: block; font-size: 0.85rem; font-weight: 700; }
        .social-hub-card small { font-size: 0.75rem; color: var(--text-muted); }

        .social-hub-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--rose-gold);
        }

        /* --- SERVICES & TRAINING SYSTEM --- */
        .tabs-nav-anchor {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .tab-trigger {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cormorant Garamond', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-trigger.active, .tab-trigger:hover {
            background: var(--primary-plum);
            color: var(--text-light);
            border-color: var(--primary-plum);
            box-shadow: var(--shadow);
        }

        [data-theme="dark"] .tab-trigger.active {
            background: var(--rose-gold);
            color: var(--charcoal);
            border-color: var(--rose-gold);
        }

        .panel-view {
            display: none;
        }

        .panel-view.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .services-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .service-luxury-card {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 2.2rem 1.8rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .service-luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--blush-pink), var(--rose-gold));
            opacity: 0;
            transition: var(--transition);
        }

        .service-luxury-card:hover::before { opacity: 1; }

        .service-luxury-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(74, 25, 66, 0.08);
            border-color: var(--rose-gold);
        }

        .card-icon-frame {
            width: 60px;
            height: 60px;
            background: var(--ivory-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--primary-plum);
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        [data-theme="dark"] .card-icon-frame {
            background: #251322;
            color: var(--rose-gold);
        }

        .service-luxury-card:hover .card-icon-frame {
            background: var(--primary-plum);
